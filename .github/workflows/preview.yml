name: Preview

# Uploads a version of the Worker "snag" for each pushed release or track branch, under a preview alias, without
# promoting it. The production deploy (deploy.yml) is untouched. Needs the same repository secret as deploy.yml,
# CLOUDFLARE_API_TOKEN; without it every step but the notice is skipped, so the run is safe either way.
# Without a token, switch on non-production branch builds in Cloudflare Workers Builds instead (docs/PREVIEWS.md).
# Only pushes to this repository's own branches trigger it, never pull requests from forks: the job runs a
# branch's own code with a deploy token in reach.
on:
  push:
    branches: ['release/**', 'claude/**']
  workflow_dispatch:

# One preview run per branch; a newer push cancels the older one.
concurrency:
  group: preview-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Explain a missing token
        if: env.HAS_CLOUDFLARE_API_TOKEN != 'true'
        run: echo "::notice::Add the CLOUDFLARE_API_TOKEN repository secret to upload branch previews, or use Workers Builds (docs/PREVIEWS.md)."
      - uses: actions/checkout@v5
        if: env.HAS_CLOUDFLARE_API_TOKEN == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        if: env.HAS_CLOUDFLARE_API_TOKEN == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: env.HAS_CLOUDFLARE_API_TOKEN == 'true'
      # A preview alias is a DNS label: lower case letters, digits and hyphens, 40 characters at most.
      - name: Compute the alias from the branch name
        if: env.HAS_CLOUDFLARE_API_TOKEN == 'true'
        shell: bash
        run: |
          ALIAS="$(printf '%s' "$GITHUB_REF_NAME" | tr 'A-Z' 'a-z' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' | cut -c1-40 | sed -E 's/-+$//')"
          echo "ALIAS=$ALIAS" >> "$GITHUB_ENV"
      # wrangler.jsonc runs `npm run build` (typecheck + Vite) before the upload, so a broken branch never uploads.
      - name: Upload a version under the alias
        if: env.HAS_CLOUDFLARE_API_TOKEN == 'true'
        shell: bash
        run: |
          npx wrangler versions upload --preview-alias "$ALIAS" --message "$GITHUB_SHA" | tee upload.log
          grep 'https://' upload.log >> "$GITHUB_STEP_SUMMARY" || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ffa768ebc2ffc3bcd0bf7847c956b9df
