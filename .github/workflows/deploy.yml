name: Deploy

# Builds the game and deploys it to the Cloudflare Worker "snag" with Wrangler.
# Needs a repository secret CLOUDFLARE_API_TOKEN (Cloudflare → My Profile → API Tokens →
# "Edit Cloudflare Workers" template). Without it the job is skipped instead of failing.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize production publishes and cancel an older run when GitHub schedules a newer one.
concurrency:
  group: production-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Explain a missing token
        if: env.HAS_CLOUDFLARE_API_TOKEN != 'true'
        run: echo "::notice::Add the CLOUDFLARE_API_TOKEN repository secret to deploy from GitHub Actions."
      - uses: actions/checkout@v5
        if: env.HAS_CLOUDFLARE_API_TOKEN == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        if: env.HAS_CLOUDFLARE_API_TOKEN == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: env.HAS_CLOUDFLARE_API_TOKEN == 'true'
      - name: Check this revision is still current
        id: current
        if: env.HAS_CLOUDFLARE_API_TOKEN == 'true'
        run: |
          remote_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [ "$remote_sha" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping a stale deployment; main now points to $remote_sha."
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      # wrangler deploy runs `npm run build` (typecheck + Vite) itself, then uploads dist/.
      - run: npx wrangler deploy
        if: env.HAS_CLOUDFLARE_API_TOKEN == 'true' && steps.current.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ffa768ebc2ffc3bcd0bf7847c956b9df
