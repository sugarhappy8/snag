name: Deploy

# Builds the game and deploys it to the Cloudflare Worker "snag" with Wrangler.
# Needs a repository secret CLOUDFLARE_API_TOKEN (Cloudflare → My Profile → API Tokens →
# "Edit Cloudflare Workers" template). Without it the job is skipped instead of failing.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ffa768ebc2ffc3bcd0bf7847c956b9df
    steps:
      - name: Explain a missing token
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::Add the CLOUDFLARE_API_TOKEN repository secret to deploy from GitHub Actions."
      - uses: actions/checkout@v5
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@v5
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: env.CLOUDFLARE_API_TOKEN != ''
      # wrangler deploy runs `npm run build` (typecheck + Vite) itself, then uploads dist/.
      - run: npx wrangler deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
