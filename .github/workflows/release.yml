name: Release

# Pushing a version tag (e.g. v1.0.0) publishes a GitHub Release with generated notes.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "AnotherLife $GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
