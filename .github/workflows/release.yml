name: Release

# Publishes a GitHub Release with generated notes, either when a version tag (e.g. v1.0.0)
# is pushed, or manually from the Actions tab ("Run workflow"), which also creates the tag
# (optionally with hand-written notes).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to create, e.g. v1.0.0
        required: true
      target:
        description: Branch or commit SHA to tag
        required: true
        default: main
      notes:
        description: Release notes (Markdown). Leave empty to generate them from merged PRs and commits.
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Publish release for a pushed tag
        if: github.event_name == 'push'
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "AnotherLife $GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Create tag and release
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ -n "$NOTES" ]; then
            printf '%s\n' "$NOTES" > notes.md
            gh release create "$TAG" --target "$TARGET" --notes-file notes.md --title "AnotherLife $TAG"
          else
            gh release create "$TAG" --target "$TARGET" --generate-notes --title "AnotherLife $TAG"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TARGET: ${{ inputs.target }}
          NOTES: ${{ inputs.notes }}
