name: Release

# Publishes a GitHub Release with generated notes, either when a version tag (e.g. v1.0.0)
# is pushed, or manually from the Actions tab ("Run workflow"), which also creates the tag
# (optionally with hand-written notes).
on:
  push:
    tags: ['v*']
  # One-time v3 handoff: only the reviewed main commit may publish automatically.
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to create, e.g. v1.0.0
        required: true
      target:
        description: Branch or commit SHA to tag
        required: true
        default: main
      notes:
        description: Release notes (Markdown). Leave empty to generate them from merged PRs and commits.
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Publish release for a pushed tag
        if: github.event_name == 'push'
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "AnotherLife $GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Create tag and release
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ -n "$NOTES" ]; then
            printf '%s\n' "$NOTES" > notes.md
            gh release create "$TAG" --target "$TARGET" --notes-file notes.md --title "AnotherLife $TAG"
          else
            gh release create "$TAG" --target "$TARGET" --generate-notes --title "AnotherLife $TAG"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TARGET: ${{ inputs.target }}
          NOTES: ${{ inputs.notes }}

  release-v3-after-ci:
    if: >-
      github.event_name == 'workflow_run' &&
      github.repository == 'sugarhappy8/snag' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_sha == '21a3ce7494171d9e80aaa7f3384766cffa1f0b58'
    runs-on: ubuntu-latest
    concurrency:
      group: release-v3.0.0
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 21a3ce7494171d9e80aaa7f3384766cffa1f0b58
          persist-credentials: false
      - name: Publish the tested v3 commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: 21a3ce7494171d9e80aaa7f3384766cffa1f0b58
        run: |
          set -euo pipefail
          existing_ref=$(gh api --paginate "repos/$GH_REPO/git/matching-refs/tags/v3.0.0" \
            --jq '.[] | select(.ref == "refs/tags/v3.0.0") | .ref')
          if [ -n "$existing_ref" ]; then
            existing_sha=$(gh api "repos/$GH_REPO/commits/v3.0.0" --jq '.sha')
            if [ "$existing_sha" != "$TARGET_SHA" ]; then
              echo 'Refusing to replace an existing v3.0.0 tag on a different commit.' >&2
              exit 1
            fi
          fi
          existing_release=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq '.[] | select(.tag_name == "v3.0.0") | .html_url')
          if [ -n "$existing_release" ]; then
            printf '%s\n' "$existing_release"
            echo 'v3.0.0 is already published; leaving it unchanged.'
            exit 0
          fi
          gh release create v3.0.0 --repo "$GH_REPO" --target "$TARGET_SHA" \
            --title 'AnotherLife v3.0.0' --notes-file docs/RELEASE-v3.0.0.md
